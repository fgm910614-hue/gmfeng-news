
name: Update news

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: update-news-main
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai

      - name: Collect news
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python collect.py

      - name: Commit updated news
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- site/data/news.json; then
            echo "No news changes to commit."
            exit 0
          fi

          cp site/data/news.json /tmp/gmfeng-news.json

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/gmfeng-news.json site/data/news.json
            git add site/data/news.json

            if git diff --cached --quiet; then
              echo "News already up to date."
              exit 0
            fi

            git commit -m "Update daily news"

            if git push origin HEAD:main; then
              echo "News published successfully."
              exit 0
            fi

            echo "Remote changed. Retrying..."
            sleep 3
          done

          echo "Failed to push after 3 attempts."
          exit 1
