
name: Update news

on:
  workflow_dispatch:

  schedule:
    # 北京时间每天早上 08:00
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: update-news-main
  cancel-in-progress: false

jobs:
  update-news:
    name: Collect and translate news
    runs-on: ubuntu-24.04

    steps:
      # 1. 获取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      # 2. 配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 采集新闻并自动翻译中文
      - name: Collect news and translate to Chinese
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          TRANSLATION_MAX_CHARS: "12000"
          OPENAI_API_KEY: ""
        run: |
          python collect.py

      # 4. 保存更新后的新闻数据
      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site/data/news.json

          if git diff --cached --quiet; then
            echo "No news changes to commit."
            exit 0
          fi

          git commit -m "Update daily news"

          # 远程分支发生变化时最多重试三次
          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main && git push origin HEAD:main; then
              echo "News updated successfully."
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed."
            sleep 5
          done

          echo "Failed to push updated news."
          exit 1
