
name: Update news

on:
  workflow_dispatch:
  schedule:
    # 北京时间每天早上 08:00
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: update-news-main
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install offline translation engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install "argostranslate>=1.9,<2" "Pillow>=10,<14"

      - name: Collect news and translate to Chinese
        timeout-minutes: 25
        env:
          TRANSLATION_MAX_CHARS: "18000"
        run: |
          python collect.py

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site/data/news.json
          if [ -d site/images/daily ]; then git add -A -- site/images/daily; fi

          if git diff --cached --quiet; then
            echo "No news changes to commit."
            exit 0
          fi

          git commit -m "Update daily news"

          # Retry if the remote branch has changed.
          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main && git push origin HEAD:main; then
              echo "News updated successfully."
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed."
            sleep 5
          done

          echo "Failed to push updated news."
          exit 1
