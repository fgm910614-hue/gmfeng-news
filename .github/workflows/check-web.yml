name: Check public reader
on:
  pull_request:
    paths: ['web/**', 'scripts/**', 'functions/**', 'site/**', 'package*.json', 'tsconfig.json', '.github/workflows/check-web.yml']
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', 'functions/**', 'site/index.html', 'site/assets/**', 'package*.json', 'tsconfig.json', '.github/workflows/check-web.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Ensure committed static assets match the source
        run: git diff --exit-code -- site/index.html site/assets
